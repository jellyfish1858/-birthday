<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Roshni!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Welcome Button Screen */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 1s ease, transform 1s ease;
        }
        .btn-open {
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff4757;
            animation: pulse 2s infinite;
            transition: transform 0.2s ease;
        }
        .btn-open:active {
            transform: scale(0.95);
        }

        /* Main Container */
        .container {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }

        /* Part 1: Emotional Message & Slideshow */
        #part1 {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: opacity 2s ease-in-out;
        }
        .slideshow-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(35%);
            transition: background-image 1.5s ease-in-out;
        }
